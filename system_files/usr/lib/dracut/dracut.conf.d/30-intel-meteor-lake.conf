# Early graphics, Thunderbolt and device-mapper support for the Core Ultra host.
force_drivers+=" i915 thunderbolt dm_snapshot "
add_drivers+=" aesni_intel ahci cryptd nvme rtsx_pci_sdmmc sd_mod sr_mod usbhid usb_storage xhci_pci "

# Preserve Bazzite's OSTree boot support: it is in the base initramfs but is
# not auto-selected when dracut runs inside a container. Also include resume
# without choosing a machine-specific swap device/offset.
add_dracutmodules+=" ostree resume "

# Offline image builds have no syslog daemon; diagnostics go to stderr.
sysloglvl=0
